<link rel="stylesheet" href="/mngr/css/calendario.css" />

<div class="cal-mngr-wrapper">
  <div class="cal-mngr-header">
    <div>
      <div class="breadcrumbs"><span class="breadcrumb-current">Calendário</span></div>
      <span class="cal-mngr-title">Maio 2026</span>
    </div>
    <div class="cal-mngr-filtro" id="filtro-equipa-wrapper" style="display: none;">
      <label>Equipa</label>
      <select id="filtro-equipa">
        <option value="">Todas as equipas</option>
      </select>
    </div>
  </div>

  <div class="cal-mngr-grid-container">
    <div class="cal-mngr-dias">
      <div>Seg</div>
      <div>Ter</div>
      <div>Qua</div>
      <div>Qui</div>
      <div>Sex</div>
      <div>Sáb</div>
      <div>Dom</div>
    </div>
    <div class="cal-mngr-grid" id="grid-calendario"></div>
  </div>

  <div class="cal-mngr-footer">
    <div class="cal-mngr-controles">
      <button id="btn-prev-mes" class="cal-btn-icon">&lt;</button>
      <button id="btn-next-mes" class="cal-btn-icon">&gt;</button>
    </div>

    <div class="cal-mngr-acoes">
      <button
        id="btn-editar-evento-selecionado"
        class="cal-mngr-btn cal-mngr-hidden"
        disabled
      >
        Editar Evento
      </button>
      <button
        id="btn-eliminar-evento-selecionado"
        class="cal-mngr-btn cal-mngr-hidden"
        disabled
      >
        Eliminar Evento
      </button>
      <button id="btn-abrir-modal" class="cal-mngr-btn cal-mngr-hidden">
        + Adicionar Evento
      </button>
    </div>
  </div>
</div>

<div id="modal-evento-mngr" class="modal-mngr-overlay cal-mngr-hidden">
  <div class="modal-mngr-content">
    <div class="modal-mngr-header-bg">
      <h3 id="titulo-modal-evento">Novo Evento Desportivo</h3>
    </div>

    <form id="form-criar-evento">
      <div class="modal-mngr-body-bg">

        <!-- Linha 1: Tipo + Título -->
        <div class="modal-row">
          <div class="modal-input-group">
            <label>Tipo de Evento</label>
            <select name="tipo_evento" id="select-tipo-evento" required>
              <option value="" disabled selected>Selecione...</option>
              <option value="treino_tatico">Treino Tático</option>
              <option value="treino_fisico">Treino Físico</option>
              <option value="treino_tecnico">Treino Técnico</option>
              <option value="jogo">Jogo</option>
              <option value="reuniao">Reunião</option>
              <option value="exame_fisico">Exame Físico</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div class="modal-input-group">
            <label>Título do Evento</label>
            <input type="text" name="titulo" required />
          </div>
        </div>

        <!-- Linha 2: Equipa (só gestor) + Competição (gestor e treinador: só jogo) -->
        <div class="modal-row">
          <div class="modal-input-group" id="container-selecao-equipa-mngr">
            <label>Equipa</label>
            <select id="select-nossa-equipa" name="id_equipa_selecionada" required>
              <option value="">Selecione a equipa...</option>
            </select>
          </div>
          <div class="modal-input-group" id="container-competicao">
            <label>Competição</label>
            <select name="competicao" id="select-competicao">
              <option value="">Sem competição</option>
            </select>
          </div>
        </div>

        <!-- Linha 3: Campos específicos de Jogo (clube rival, logótipo, jogo oficial) -->
        <div class="modal-row cal-mngr-hidden" id="campos-jogo" style="grid-template-columns: 1fr 1fr 1fr;">
          <div class="modal-input-group">
            <label>Clube Rival</label>
            <input type="text" name="equipa_rival" id="input-clube-rival" placeholder="Nome do clube rival..." />
          </div>
          <div class="modal-input-group">
            <label for="logo_file_rival">Logótipo Rival</label>
            <div class="file-upload-wrapper">
              <input type="file" id="logo_file_rival" name="avatar" class="file-input-hidden" accept="image/png, image/jpeg, image/webp" />
              <label for="logo_file_rival" class="main-input file-upload-label"><span>Selecionar imagem...</span></label>
            </div>
          </div>
          <div class="modal-input-group" style="justify-content: flex-end; padding-bottom: 8px;">
            <label class="cal-mngr-toggle">
              <input type="checkbox" name="oficial" id="chk-oficial" />
              <div class="toggle-switch"></div>
              <span class="toggle-text">Jogo Oficial</span>
            </label>
          </div>
        </div>

        <!-- Linha 4: Horário + Duração (treino) + Localização -->
        <!-- grid ignora display:none — sem treino fica hora|local; com treino fica hora|duração e local cai sozinho abaixo -->
        <div class="modal-row">
          <div class="modal-input-group">
            <label>Hora de Início</label>
            <input type="time" name="hora_inicio" required />
          </div>
          <div class="modal-input-group cal-mngr-hidden" id="campos-treino">
            <label>Duração (minutos)</label>
            <input type="number" name="duracao" min="1" placeholder="Ex: 90" />
          </div>
          <div class="modal-input-group">
            <label>Localização</label>
            <input type="text" name="local" required />
          </div>
        </div>

        <!-- Linha 6: Descrição -->
        <div class="modal-input-group">
          <label>Descrição / Notas</label>
          <textarea class="modal-textarea" name="descricao" placeholder="Adicionar descrição ou notas..." rows="3"></textarea>
        </div>

      </div>

      <input type="hidden" name="id_evento" id="id-evento-editar" value="" />
      <input type="hidden" name="data_evento" id="input-data-evento" value="" />

      <div class="modal-actions">
        <button
          type="button"
          id="btn-eliminar-evento-modal"
          class="btn-cancelar cal-mngr-hidden"
        >
          Eliminar Evento
        </button>
        <button type="button" id="btn-fechar-modal" class="btn-cancelar">
          Cancelar
        </button>
        <button type="submit" id="btn-submit-evento" class="btn-confirmar">
          Criar Evento
        </button>
      </div>
    </form>
  </div>
</div>

<script src="/mngr/js/calendario.js"></script>
