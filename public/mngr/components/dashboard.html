<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNGR - A carregar...</title>
    <link rel="stylesheet" href="/mngr/css/styles.css">
    <link rel="stylesheet" href="/mngr/css/layout.css">
    <link rel="stylesheet" href="/mngr/css/atleta.css">
    <link rel="stylesheet" href="/mngr/css/mensagens.css">
    <link rel="stylesheet" href="/mngr/css/calendario.css">
    <link rel="icon" href="../images/logo-mini.png" type="image/x-icon" />
</head>
<body>

    <div class="app-container">
        <div id="sidebar-placeholder" class="app-sidebar"></div>
        <div id="navbar-placeholder" class="app-navbar"></div>

        <main class="app-conteudo">
            </main>
    </div>

    <div id="modal-alerta-global" class="modal-overlay cal-mngr-hidden" style="display: none; z-index: 99999; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5);">
        <div class="modal-content" style="background: white; max-width: 380px; width: 90%; text-align: center; padding: 30px 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <div id="icone-alerta-global" style="font-size: 48px; margin-bottom: 15px; line-height: 1;">⚠️</div>
            <h3 id="titulo-alerta-global" style="margin: 0 0 10px 0; color: #0f172a; font-size: 18px; font-weight: 800;">Aviso</h3>
            <p id="mensagem-alerta-global" style="color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5;"></p>
            <button id="btn-fechar-alerta-global" style="width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s;">OK</button>
        </div>
    </div>

    <script src="/mngr/js/bars.js"></script>
    <script src="/mngr/js/calendario.js"></script>

</body>
</html>
