<div class="dashboard-container">
  <div class="breadcrumbs">
    <span class="breadcrumb-current">O Meu Perfil</span>
  </div>

  <div class="team-profile-card">
    <div class="team-logo-wrapper">
      <input
        type="file"
        id="input-avatar-escondido"
        accept="image/*"
        style="display: none"
      />

      <div
        class="profile-avatar"
        id="zona-clique-avatar"
        style="
          width: 70px;
          height: 70px;
          font-size: 24px;
          font-weight: 700;
          color: var(--text-primary);
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: var(--bg-card-active);
          border-radius: 50%;
          cursor: pointer;
          position: relative;
          overflow: hidden;
          background-size: cover;
          background-position: center;
        "
      >
        <span id="avatar-iniciais">U</span>

        <div
          class="avatar-overlay-upload"
          style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 11px;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
          "
        >
          Alterar
        </div>
      </div>
    </div>
    <div class="team-season-info">
      <h2 id="header-nome-completo">Carregando...</h2>
      <p class="team-info">
        <span class="badge-tipo" id="header-tipo-utilizador">-</span>
        <span class="breadcrumb-separator">•</span>
        <span id="header-estado">-</span>
      </p>
    </div>
  </div>

  <div class="card">
    <h3 class="section-title">Dados da Conta</h3>

    <form id="form-perfil" class="grid-form-detalhes">
      <div class="input-group full-width">
        <label
          style="
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
          "
          >Nome Completo</label
        >
        <input
          type="text"
          id="perfil-nome-completo"
          class="custom-input"
          placeholder="Nome Completo"
          readonly
          style="width: 100%"
        />
      </div>

      <div class="input-group">
        <label
          style="
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
          "
          >Username (Nome)</label
        >
        <input
          type="text"
          id="perfil-nome"
          class="custom-input"
          placeholder="Username"
          readonly
          style="width: 100%"
        />
      </div>

      <div class="input-group">
        <label
          style="
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
          "
          >Endereço de Email</label
        >
        <input
          type="email"
          id="perfil-email"
          class="custom-input"
          placeholder="Email"
          readonly
          style="width: 100%"
        />
      </div>

      <div class="input-group">
        <label
          style="
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
          "
          >Tipo de Utilizador</label
        >
        <input
          type="text"
          id="perfil-tipo"
          class="custom-input"
          readonly
          style="width: 100%; background-color: #e2e8f0"
        />
      </div>

      <div class="input-group">
        <label
          style="
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
          "
          >Conta Criada Em</label
        >
        <input
          type="text"
          id="perfil-criado-em"
          class="custom-input"
          readonly
          style="width: 100%; background-color: #e2e8f0"
        />
      </div>
    </form>
  </div>

  <div class="card" style="margin-top: 20px;">
    <h3 class="section-title">Segurança</h3>

    <form id="form-alterar-password" class="grid-form-detalhes">
      <div class="input-group full-width">
        <label style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 600; font-size: 14px;">Palavra-passe Atual</label>
        <input type="password" id="pass-atual" name="senhaAtual" class="custom-input" placeholder="Insere a tua palavra-passe atual" required style="width: 100%" />
      </div>

      <div class="input-group">
        <label style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 600; font-size: 14px;">Nova Palavra-passe</label>
        <input type="password" id="pass-nova" name="novaSenha" class="custom-input" placeholder="Mínimo de 6 caracteres" required minlength="6" style="width: 100%" />
      </div>

      <div class="input-group">
        <label style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 600; font-size: 14px;">Confirmar Nova Palavra-passe</label>
        <input type="password" id="pass-confirmar" class="custom-input" placeholder="Repete a nova palavra-passe" required minlength="6" style="width: 100%" />
      </div>

      <div class="input-group full-width" style="display: flex; justify-content: flex-end; margin-top: 10px;">
        <button type="submit" id="btn-submit-password" style="background-color: #0ea5e9; color: white; padding: 10px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;">Atualizar Palavra-passe</button>
      </div>
    </form>
    
    <div id="msg-password" style="margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 14px; display: none; text-align: center;"></div>
  </div>
</div>


<script src="/mngr/js/perfil.js"></script>
